[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineval"
version = "0.1.0a4"
readme = "README.md"
description = "Historical benchmark preparation and private verification extraction with rootless Docker"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mineval = "mineval.cli:main"

[tool.setuptools.packages.find]
include = ["mineval*"]

[project.optional-dependencies]
arena-share = ["Pillow>=10", "playwright>=1.40"]

[tool.setuptools.package-data]
mineval = ["web/*.html", "web/*.css", "web/*.js"]
