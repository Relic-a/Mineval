name: Build release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: python -m pip install --require-hashes -r packaging/build-requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m build
      - run: scripts/build-standalone.sh
      - run: python scripts/smoke-standalone.py
      - name: Python-free runtime smoke
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:exec -v "$PWD/dist/mineval:/usr/local/bin/mineval:ro" debian:bookworm-slim sh -c '! command -v python3 && mineval --help && mineval --data /tmp/store task list'
      - name: Name and checksum candidate
        run: |
          VERSION=v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          cp dist/mineval "dist/mineval-$VERSION-linux-x86_64"
          cd dist
          sha256sum "mineval-$VERSION-linux-x86_64" > "mineval-$VERSION-linux-x86_64.sha256"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/mineval-v*-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: dist/
# Publication is intentionally manual and requires authorization.
